[project]
name = "llmfit"
version = "0.1.0"
description = "Estimate LLM memory requirements and browse models"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "huggingface-hub>=0.16.0",
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
llmfit = "llmfit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
